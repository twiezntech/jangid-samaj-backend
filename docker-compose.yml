services:
  postgres:
    image: postgres:16-alpine
    container_name: jangid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jangid
      POSTGRES_PASSWORD: jangid_dev_pass
      POSTGRES_DB: jangid_samaj
    ports:
      - "5432:5432"
    volumes:
      - jangid_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jangid_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  jangid_postgres_data:
